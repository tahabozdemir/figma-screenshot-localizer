name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in package.json engines; 24 is what most
        # contributors will actually have installed.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check every project
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the build produced what the manifest points at
        run: |
          node -e "
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            for (const file of [manifest.main, manifest.ui]) {
              if (!fs.existsSync(file)) throw new Error('manifest points at a missing file: ' + file);
            }
            const html = fs.readFileSync(manifest.ui, 'utf8');
            if (html.includes('INJECT_')) throw new Error('ui.html still has an uninjected placeholder');
            if (!html.includes('<style>') || !html.includes('<script>')) {
              throw new Error('ui.html is not self-contained');
            }
            console.log('ok: ' + manifest.main + ' + ' + manifest.ui);
          "
